# SETUP — do this once:
#
# 1. In your special profile repo (AceBreaker-Cell/AceBreaker-Cell), create the
#    folder path  .github/workflows/  and save this file inside it as
#    pacman.yml  (rename it, drop these top comments if you like).
#
# 2. Commit + push. Then go to the repo's "Actions" tab, select
#    "generate pacman game" on the left, click "Run workflow" once to
#    generate the first SVG. After that it re-runs automatically every day.
#
# 3. Make sure the repo is public — the SVGs get pushed to an "output"
#    branch and read from raw.githubusercontent.com, which only works for
#    public repos.
#
# Source project: https://github.com/abozanona/pacman-contribution-graph
# (same idea as the classic "snake eats your contributions" trick, just
# with Pac-Man + ghosts instead of a snake)

name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
